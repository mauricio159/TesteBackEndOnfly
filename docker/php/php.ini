; Ajustes de desempenho para desenvolvimento com Docker no Windows.
;
; O código fica numa pasta do Windows montada no container, e cada leitura
; de arquivo atravessa essa "ponte", o que é lento. O Laravel carrega
; centenas de arquivos por requisição, então guardamos o máximo em memória:

; Cache do bytecode do PHP. Confere se o arquivo mudou no máximo a cada
; 2 segundos, então suas alterações aparecem quase na hora.
opcache.enable=1
opcache.memory_consumption=192
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Cache de "onde está cada arquivo" (evita repetir stat() na pasta montada).
realpath_cache_size=8M
realpath_cache_ttl=600

memory_limit=256M
